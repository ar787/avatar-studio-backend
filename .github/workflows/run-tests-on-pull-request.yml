name: Run test suite on pull request

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run tests with Firebase Emulator
        run: firebase emulators:exec --only firestore,storage --project demo-test 'npm test'
        env:
          FIREBASE_PROJECT_ID: demo-test
          FIREBASE_STORAGE_BUCKET: demo-test.appspot.com

      - name: Convert JUnit report to CTRF
        if: always()
        run: npx junit-to-ctrf ctrf/junit.xml -o ctrf/ctrf-report.json

      - name: Publish Test Summary Results
        if: always()
        run: npx github-actions-ctrf pull-request ctrf/ctrf-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
